name: flutter_chatkit
description: "A premium AI chat application built with Flutter, GetX, and Firebase."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Navigation
  get: ^4.6.6
  http: ^1.2.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.3.10

  # Local Storage (Native & Web)
  shared_preferences: ^2.3.2

  # Environment Variables
  flutter_dotenv: ^5.2.1

  # UI Components
  flutter_markdown_plus: ^1.0.6
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  uuid: ^4.5.1
  gal: ^2.3.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
