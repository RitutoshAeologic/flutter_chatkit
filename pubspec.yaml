name: flutter_chatkit
description: "Offline document Q&A — extracts answers from locally stored document embeddings."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Navigation
  get: ^4.6.6
  http: ^1.2.2           # Jina AI embed API (ingestion only)
  uuid: ^4.5.1           # message ID generation

  # UI Components
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  intl: ^0.19.0          # date formatting in KbManagerScreen

  # ObjectBox — offline vector storage & search
  objectbox: ^5.3.1
  objectbox_flutter_libs: ^5.3.1

  # Document ingestion
  file_picker: ^8.1.2
  syncfusion_flutter_pdf: ^27.2.4  # text-based PDF extraction
  crypto: ^3.0.3                   # SHA-256 dedup

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.11
  objectbox_generator: ^5.3.1

flutter:
  uses-material-design: true
