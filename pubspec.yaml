name: flutter_chatkit
description: "A premium AI chat application built with Flutter, GetX, and Firebase."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Navigation
  get: ^4.6.6
  http: ^1.2.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.3.10

  # Local Storage (Native & Web)
  shared_preferences: ^2.3.2

  # UI Components
  flutter_markdown_plus: ^1.0.6
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  uuid: ^4.5.1
  gal: ^2.3.2

  # RAG additions
  objectbox: ^5.3.1
  objectbox_flutter_libs: ^5.3.1   # native C library for Android/iOS
  file_picker: ^8.1.2
  syncfusion_flutter_pdf: ^27.2.4  # text-based PDFs only
  crypto: ^3.0.3                   # SHA-256 deduplication
  intl: ^0.19.0                    # date formatting in KbManagerScreen

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.11
  objectbox_generator: ^5.3.1

flutter:
  uses-material-design: true
