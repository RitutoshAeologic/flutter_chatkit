name: flutter_chatkit
description: "Offline document Q&A — answers extracted from bundled PDF knowledge base."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Navigation
  get: ^4.6.6
  http: ^1.2.2           # Jina embed API (ingestion) + optional Groq formatter
  uuid: ^4.5.1
  connectivity_plus: ^6.1.4  # network state monitoring
  shared_preferences: ^2.3.5  # persist query embed cache across sessions

  # UI
  flutter_animate: ^4.5.0
  intl: ^0.19.0

  # ObjectBox — offline vector storage & search
  objectbox: ^5.3.1
  objectbox_flutter_libs: ^5.3.1

  # Document ingestion — bundled assets only (no user upload)
  syncfusion_flutter_pdf: ^27.2.4
  crypto: ^3.0.3
  flutter_svg: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.11
  objectbox_generator: ^5.3.1

flutter:
  uses-material-design: true

  # ── Bundled PDF knowledge base ─────────────────────────────────────────────
  # Add your PDFs to assets/pdfs/ and list them below.
  # They will be indexed on first install and searched offline.
  assets:
    - assets/pdfs/
    - assets/svg/

  # ── Bundled fonts (fully offline — no network needed in release builds) ────
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
